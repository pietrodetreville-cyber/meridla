<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.35 Arial,Helvetica,sans-serif;color:#1f2933;background:#f4f6f9}
  .wrap{display:grid;grid-template-columns:minmax(300px,38%) 1fr;gap:12px;height:100vh;padding:12px}
  .pane{background:#fff;border:1px solid #d9dee5;border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
  .ph{padding:10px 12px;border-bottom:1px solid #e5e9ee;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ph b{flex:1}
  select,input,button{font:inherit}
  select,input{border:1px solid #c5ccd6;border-radius:6px;padding:5px 6px;background:#fff;min-width:0}
  button{border:0;border-radius:8px;padding:8px 14px;background:#2563eb;color:#fff;cursor:pointer;font-weight:600}
  button.sec{background:#e8edf5;color:#1f2933}
  button.warn{background:#b45309}
  button:disabled{opacity:.5;cursor:default}
  #img{flex:1;overflow:auto;padding:8px;text-align:center;min-height:0}
  #img img{max-width:100%;cursor:zoom-in;border-radius:6px}
  #img img.full{max-width:none;cursor:zoom-out}
  #tw{flex:1;overflow:auto;min-height:0}
  table{border-collapse:collapse;width:100%}
  th{position:sticky;top:0;background:#eef2f7;text-align:left;font-size:12px;padding:6px;border-bottom:1px solid #d9dee5;z-index:1}
  td{padding:3px 4px;border-bottom:1px solid #eef1f5;vertical-align:middle}
  td input,td select{width:100%}
  td.n input{text-align:right}
  tr.done td{background:#f0fdf4;color:#555}
  tr.off td{opacity:.45}
  .b{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;white-space:normal}
  .ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.wait{background:#fef3c7;color:#92400e}.off2{background:#e5e7eb;color:#374151}
  .foot{padding:10px 12px;border-top:1px solid #e5e9ee;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .foot .msg{flex:1;min-width:160px;color:#374151;max-height:84px;overflow:auto;font-size:13px}
  .muted{color:#6b7280;font-size:12px}
  @media (max-width:800px){.wrap{grid-template-columns:1fr;height:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="pane">
    <div class="ph"><b>1. Arch z Google Disku</b><span class="muted">složka Papírové záznamy</span></div>
    <div class="ph"><select id="arch" style="flex:1"></select><button id="reread" type="button" title="Pošle vybranou fotku do AI a přepíše z ní hodnoty do tabulky">2. Načíst AI</button><button class="sec" id="reload" type="button" title="Znovu načte seznam fotek z Disku">↻</button></div>
    <div id="img"><div class="muted" style="padding:20px">Vyber arch ze seznamu. Fotky se do složky ukládají z aplikace (🔒 Správce).</div></div>
  </div>
  <div class="pane">
    <div class="ph"><b id="ttl">Načtené řádky vybraného archu</b>
      <button class="sec" id="droparch" type="button" title="Označí nezapsané řádky vybraného archu jako vyřazené (nic se nemaže)">Vyřadit řádky archu</button>
      <button class="sec" id="dropold" type="button" style="display:none" title="Označí nezapsané řádky ostatních archů jako vyřazené (nic se nemaže)">Uklidit staré</button>
      <button class="sec" id="add" type="button">+ Řádek</button>
    </div>
    <div id="tw"><table><thead><tr><th style="width:34px" title="Zahrnout do zápisu">✓</th><th style="width:100px">Datum</th><th style="width:90px">Budova</th><th style="width:100px">Druh</th><th style="min-width:210px">Měřidlo</th><th style="width:100px">Stav</th><th style="width:190px">Výsledek</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="foot">
      <span class="msg" id="msg">Načítám…</span>
      <button class="sec" id="save" type="button" title="Uloží řádky do listu Import z papíru a zkontroluje je">Uložit do Importu z papíru</button>
      <button id="write" type="button">3. Zapsat do Odečtů</button>
    </div>
  </div>
</div>
<script>
let D = null, rows = [], files = [], busy = false;
const $ = id => document.getElementById(id);
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const closed = s => /^(ZAPSÁNO|VYŘAZENO)/.test(String(s || ''));
function setMsg(t, bad) { const m = $('msg'); m.textContent = t; m.style.color = bad ? '#991b1b' : '#374151'; }
function lock(on) { busy = on; ['save', 'write', 'add', 'reread', 'reload', 'droparch', 'dropold', 'arch'].forEach(i => $(i).disabled = on); }
const errText = e => (e && e.message) || String(e) || 'server nevrátil text chyby (možná vypršel čas, zkus menší fotku)';

function opt(sel, value, label) { const o = document.createElement('option'); o.value = value; o.textContent = label === undefined ? value : label; sel.appendChild(o); return o; }
function selectOf(values, current, blank) {
  const s = document.createElement('select');
  opt(s, '', blank || '—');
  const list = values.slice(); if (current && list.indexOf(current) < 0) list.push(current);
  list.forEach(v => opt(s, v));
  s.value = current || '';
  return s;
}
function meterSelect(current) {
  const s = document.createElement('select');
  opt(s, '', 'automaticky (budova + druh)');
  let cur = current || '';
  const hit = D.meters.find(m => norm(m.id) === norm(cur));
  if (hit) cur = hit.id;
  D.meters.forEach(m => opt(s, m.id, m.label));
  if (cur && !hit) opt(s, cur, 'číslo: ' + cur);
  s.value = cur;
  return s;
}
function badge(status) {
  const b = document.createElement('span'); b.className = 'b';
  const t = String(status || '');
  if (/^ZAPSÁNO/.test(t)) { b.classList.add('ok'); b.textContent = t; }
  else if (/^OK/.test(t)) { b.classList.add('ok'); b.textContent = t.replace(/^OK, zapíše se/, 'Zapíše se'); }
  else if (/^CHYBA/.test(t)) { b.classList.add('err'); b.textContent = t.replace(/^CHYBA: /, ''); }
  else if (/^PŘESKOČENO/.test(t)) { b.classList.add('wait'); b.textContent = t; }
  else { b.classList.add('wait'); b.textContent = t || 'K ověření'; }
  return b;
}

// řádky vybraného archu (vyřazené se nezobrazují) a nezapsané řádky ostatních archů
const cur = () => $('arch').value;
const shown = () => rows.filter(r => r.foto === cur() && !/^VYŘAZENO/.test(r.status || ''));
const strays = () => rows.filter(r => r.foto !== cur() && !closed(r.status) && !r.exclude);

function render() {
  const tb = $('rows'); tb.textContent = '';
  const list = shown();
  list.forEach(r => {
    const st = String(r.status || '');
    const done = /^ZAPSÁNO/.test(st), tr = document.createElement('tr');
    tr.className = done ? 'done' : (r.exclude ? 'off' : '');
    const td = () => tr.appendChild(document.createElement('td'));
    const c0 = td(), ck = document.createElement('input'); ck.type = 'checkbox'; ck.checked = !r.exclude; ck.disabled = done; ck.title = 'Zahrnout do zápisu';
    ck.onchange = () => { r.exclude = !ck.checked; tr.className = r.exclude ? 'off' : ''; }; c0.appendChild(ck);
    const inp = (key, cls, ph) => { const c = td(); if (cls) c.className = cls; const e = document.createElement('input'); e.value = r[key] || ''; e.disabled = done; if (ph) e.placeholder = ph; e.oninput = () => { r[key] = e.value; r.dirty = true; }; c.appendChild(e); return e; };
    inp('datum', '', 'd. m. rrrr');
    const sel = (key, values, blank) => { const c = td(), s = selectOf(values, r[key], blank); s.disabled = done; s.onchange = () => { r[key] = s.value; r.dirty = true; }; c.appendChild(s); };
    sel('budova', D.buildings); sel('druh', D.types);
    const cm = td(), ms = meterSelect(r.cislo); ms.disabled = done; ms.onchange = () => { r.cislo = ms.value; r.dirty = true; }; cm.appendChild(ms);
    inp('stav', 'n');
    const cs = td(); cs.appendChild(badge(st));
    tb.appendChild(tr);
  });
  if (!list.length) {
    const tr = document.createElement('tr'), c = document.createElement('td'); c.colSpan = 7; c.className = 'muted'; c.style.padding = '16px';
    c.textContent = cur() ? 'K tomuto archu zatím nejsou žádné hodnoty. Zvol Načíst AI, nebo přidej řádek ručně.' : 'Nejdřív vyber arch ze seznamu.';
    tr.appendChild(c); tb.appendChild(tr);
  }
  const n = strays().length, b = $('dropold');
  b.style.display = n ? '' : 'none'; b.textContent = 'Uklidit staré (' + n + ')';
}

// seznam archů = všechny fotky ve složce Papírové záznamy (nejnovější nahoře) + archy, které mají řádky v tabulce
function archList() {
  const names = files.map(f => f.name);
  D.arches.forEach(a => { if (names.indexOf(a) < 0) names.push(a); });
  return names;
}
function fillArches(want) {
  const s = $('arch'), prev = want || s.value; s.textContent = '';
  const list = archList();
  if (!list.length) { opt(s, '', '— složka je prázdná —'); s.value = ''; return showPhoto(); }
  list.forEach(a => {
    const n = rows.filter(r => r.foto === a && !/^VYŘAZENO/.test(r.status || '')).length;
    opt(s, a, a + (n ? '  ·  ' + n + ' řádků' : '  ·  nepřečteno'));
  });
  const pick = prev && list.indexOf(prev) >= 0 ? prev : list[0];
  const changed = pick !== s.dataset.shown; s.value = pick;
  if (changed) { s.dataset.shown = pick; showPhoto(); }
}
function showPhoto() {
  const n = cur(), box = $('img');
  if (!n) { box.innerHTML = '<div class="muted" style="padding:20px">Vyber arch ze seznamu. Fotky se do složky ukládají z aplikace (🔒 Správce).</div>'; return; }
  box.innerHTML = '<div class="muted" style="padding:20px">Načítám fotku…</div>';
  google.script.run.withSuccessHandler(u => {
    if (cur() !== n) return;
    box.textContent = '';
    if (!u) { box.innerHTML = '<div class="muted" style="padding:20px">Fotka ve složce Papírové záznamy nenalezena.</div>'; return; }
    const im = document.createElement('img'); im.src = u; im.onclick = () => im.classList.toggle('full'); box.appendChild(im);
  }).withFailureHandler(e => { box.textContent = 'Fotku se nepodařilo načíst: ' + errText(e); }).importUiPhoto(n);
}

function load(keepMsg) {
  lock(true);
  google.script.run.withSuccessHandler(d => {
    D = d; rows = d.rows.map(r => Object.assign({}, r));
    google.script.run.withSuccessHandler(r => { files = (r && r.files) || []; done(); }).withFailureHandler(() => { files = []; done(); }).importUiFiles();
    function done() {
      fillArches(window.__newArch); window.__newArch = ''; render(); lock(false);
      if (!keepMsg) setMsg(cur() ? 'Zkontroluj hodnoty podle fotky, oprav je a zvol Uložit do Importu z papíru.' : 'Vyber arch ze seznamu.');
    }
  }).withFailureHandler(e => { lock(false); setMsg('Chyba načtení: ' + errText(e), true); }).importUiData();
}

function payload() {
  return rows.filter(r => !/^ZAPSÁNO/.test(r.status || '')).map(r => ({ row: r.row, datum: r.datum, budova: r.budova, druh: r.druh, cislo: r.cislo, stav: r.stav, poznamka: r.poznamka, foto: r.foto, exclude: !!r.exclude }));
}
function saveThen(next) {
  lock(true); setMsg('Ukládám…');
  google.script.run.withSuccessHandler(() => next()).withFailureHandler(e => { lock(false); setMsg('Uložení se nepovedlo: ' + errText(e), true); }).importUiSave(payload());
}
$('save').onclick = () => saveThen(() => {
  setMsg('Kontroluji…');
  google.script.run.withSuccessHandler(r => { load(true); setTimeout(() => setMsg((r && r.text) || 'Uloženo a zkontrolováno.'), 400); }).withFailureHandler(e => { lock(false); setMsg('Kontrola selhala: ' + errText(e), true); }).importUiRun(false);
});
$('write').onclick = () => {
  const s = strays().length;
  if (s) return setMsg('V jiných archech je ' + s + ' nezapsaných řádků a zápis by je zapsal také. Nejdřív je odstraň tlačítkem Uklidit staré (jen je označí jako vyřazené).', true);
  const n = shown().filter(r => !r.exclude && !closed(r.status)).length;
  if (!n) return setMsg('Není co zapsat.', true);
  if (!confirm('Opravdu zapsat ' + n + ' řádků do měření? Zapsané řádky se označí a podruhé se nezapíšou.')) return;
  saveThen(() => {
    setMsg('Zapisuji…');
    google.script.run.withSuccessHandler(r => { load(true); setTimeout(() => setMsg(r.text || 'Zapsáno.'), 400); }).withFailureHandler(e => { lock(false); setMsg('Zápis selhal: ' + errText(e), true); }).importUiRun(true);
  });
};
$('add').onclick = () => {
  if (!cur()) return setMsg('Nejdřív vyber fotku archu.', true);
  const last = shown().filter(r => r.datum).pop();
  rows.push({ row: 0, datum: last ? last.datum : '', budova: '', druh: '', cislo: '', stav: '', poznamka: '', foto: cur(), status: '' });
  render(); $('tw').scrollTop = 1e9;
};
// vyřazení = jen označení VYŘAZENO (nic se nemaže), import takové řádky přeskočí
function dropRows(pred, label) {
  if (busy) return;
  const hit = rows.filter(r => !closed(r.status) && pred(r));
  if (!hit.length) return setMsg('Není co vyřadit.', true);
  if (!confirm('Vyřadit ' + hit.length + ' řádků (' + label + ')? Nic se nemaže, řádky se jen označí jako VYŘAZENO a import je přeskočí.')) return;
  hit.forEach(r => { r.exclude = true; });
  saveThen(() => { load(true); setTimeout(() => setMsg('Vyřazeno řádků: ' + hit.length + '.'), 400); });
}
$('droparch').onclick = () => { const a = cur(); if (!a) return setMsg('Nejdřív vyber arch.', true); dropRows(r => r.foto === a, 'z vybraného archu'); };
$('dropold').onclick = () => dropRows(r => r.foto !== cur(), 'z ostatních archů');
$('arch').onchange = () => { render(); showPhoto(); };

function aiDone(r) {
  if (!r || !r.ok) { lock(false); return setMsg(r && r.error === 'nofile' ? 'Fotka ve složce Papírové záznamy nenalezena.' : r && r.error === 'toobig' ? 'Fotka je větší než 15 MB, zmenši ji.' : 'Čtení se nepovedlo' + (r && r.detail ? ': ' + r.detail : '.'), true); }
  window.__newArch = r.name; load(true);
  setTimeout(() => setMsg(r.count ? 'AI přepsala ' + r.count + ' hodnot. Zkontroluj je podle fotky a oprav.' : 'AI hodnoty nepřečetla' + (r.detail ? ' (' + r.detail + ')' : '') + '. Zkus to později, nebo doplň ručně tlačítkem + Řádek.', !r.count), 700);
}
$('reread').onclick = () => {
  const n = cur(); if (!n || busy) return setMsg('Nejdřív vyber arch.', true);
  const have = shown().length;
  if (have && !confirm('K tomuto archu už je v tabulce ' + have + ' řádků. Čtení přidá další, takže se mohou zdvojit. Pokračovat?')) return;
  lock(true); setMsg('AI čte fotku (až minutu)…');
  google.script.run.withSuccessHandler(aiDone).withFailureHandler(e => { lock(false); setMsg('Čtení selhalo: ' + errText(e), true); }).importUiReread(n);
};
$('reload').onclick = () => { if (!busy) { setMsg('Načítám seznam z Disku…'); load(true); setTimeout(() => setMsg('Seznam obnoven.'), 700); } };
load();
</script>
</body>
</html>
