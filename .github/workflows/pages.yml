# Publikace na GitHub Pages: ostrá verze z větve main (adresa /app/) a testovací z větve test (adresa /test/app/).
# Nasazení běží vždy z větve main (GitHub Pages smí nasazovat jen odtud). Push do větve test jen spustí nasazení z main.
name: Publikace na GitHub Pages

on:
  push:
    branches: [main, test]
  workflow_dispatch:

jobs:
  spustit-z-main:
    # push do větve test: požádá o nasazení z main, které do webu přibalí aktuální větev test
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Spuštění nasazení z větve main
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Stažení větve main (ostrá verze)
        uses: actions/checkout@v6
        with:
          ref: main
          path: _site

      - name: Stažení větve test (testovací verze)
        uses: actions/checkout@v6
        with:
          ref: test
          path: _test

      - name: Sestavení webu
        run: |
          mkdir -p _site/test
          cp -R _test/app _site/test/app
          rm -rf _site/.git _site/.github
          # testovací verze má jiný název, aby se při instalaci nepletla s ostrou
          sed -i 's/"name": "[^"]*"/"name": "Fotoapp SVJ – TEST"/; s/"short_name": "[^"]*"/"short_name": "SVJ TEST"/; s/"theme_color": "[^"]*"/"theme_color": "#b45309"/' _site/test/app/manifest.webmanifest

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub občas nahraný balíček webu hned po nahrání ještě „nevidí“ (No artifacts named github-pages):
      # počkat a zkusit nasazení až třikrát
      - name: Krátké čekání, než GitHub balíček zaeviduje
        run: sleep 30

      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Čekání před druhým pokusem
        if: steps.deploy1.outcome == 'failure'
        run: sleep 90

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Čekání před třetím pokusem
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 180

      - id: deployment
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
