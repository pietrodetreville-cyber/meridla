<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4fd1ac">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Fotoapp SVJ Od Vysoké</title>
<meta name="apple-mobile-web-app-title" content="Fotoapp SVJ">
<meta name="application-name" content="Fotoapp SVJ">
<style>
:root{--bg:#e8f1fa;--card:#fbfdff;--fg:#12222e;--mut:#56707f;--acc:#4fd1ac;--acc-fg:#06312a;--warn:#c2312a;--ok:#0e9a76;--line:#cadcec}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b27;--card:#152939;--fg:#e8f3fa;--mut:#8ea9bb;--acc:#5fe0bb;--acc-fg:#04271f;--warn:#ff8a80;--ok:#5fe0bb;--line:#25425a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:1.3rem;margin:18px 0 12px}
#ver{display:block;font-weight:400;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:var(--acc-fg);font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.big{width:100%;padding:16px;font-size:1.1rem}
.meter{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:14px;margin-bottom:10px;border-radius:14px}
.meter .t{flex:1}.meter b{display:block;font-size:1.05rem}
.meter .s{font-size:.85rem;color:var(--mut)}
.chip{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok);color:var(--acc-fg)}
.chip.todo{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.note{color:var(--mut);font-size:.85rem}
.warn{color:var(--warn)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 3px}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input.num{font-size:1.8rem;font-weight:700;text-align:center}
img.shot{width:100%;border-radius:10px;display:block}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
.hide{display:none}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px 16px 16px;margin-bottom:14px;color:#06312a;background:linear-gradient(135deg,#7ae6c6 0%,#4fd1ac 45%,#7fb6f2 100%);box-shadow:0 6px 18px #4fd1ac55}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:#ffffff40}
.hero .hi{font-size:1.05rem;font-weight:700}
.hero .big{font-size:1.7rem;font-weight:800;margin:2px 0 8px}
.bar{height:10px;border-radius:999px;background:#ffffff80;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:#06312a;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.brand img{width:44px;height:44px;border-radius:12px;box-shadow:0 3px 10px #0002}
.brand h1{margin:0;font-size:1.2rem;line-height:1.15}
.meter{transition:transform .12s,box-shadow .2s;box-shadow:0 2px 8px #0a2a4010;animation:rise .45s both}
.meter:active{transform:scale(.97)}
.meter.done{background:linear-gradient(90deg,#4fd1ac22,transparent 60%),var(--card);border-color:#4fd1ac88}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:#7fb6f233}
.meter.done .ico{background:#4fd1ac44}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
#yay{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#0e1b27d9;color:#fff;text-align:center;animation:fade .25s both}
#yay.hide{display:none}
#yay .tick{width:110px;height:110px;border-radius:50%;background:#4fd1ac;color:#06312a;display:grid;place-items:center;font-size:3.4rem;font-weight:800;animation:pop .5s both}
#yay b{font-size:1.5rem}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#vf{position:fixed;inset:0;background:#000;z-index:10}
#vf.hide{display:none}
#vf video{width:100%;height:100%;object-fit:cover}
#frame{position:absolute;left:50%;top:42%;width:92vw;height:56vw;max-height:60vh;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
#hint{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 14px);text-align:center;color:#fff;font-weight:600}
#bar{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;gap:12px}
#bar button{flex:1}#bar .sec{color:#fff;border-color:#fff8}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:30;text-align:center}
#toast.hide{display:none}
</style>
</head>
<body>
<main>
<div class="brand"><img src="icon.svg" alt=""><h1>Fotoapp SVJ Od Vysoké <span class="note" id="ver"></span></h1></div>
<div class="hero" id="hero"><div class="hi" id="who"></div><div class="big" id="progress">…</div><div class="bar"><i id="barfill"></i></div></div>
<div id="upd" class="card hide" style="border-color:var(--acc)"><strong>Je k dispozici nová verze.</strong><div class="row"><button id="updgo" type="button">Aktualizovat</button></div></div>
<div id="queue" class="card hide"><span id="qtext"></span> <button class="sec" id="qgo" type="button" style="margin-top:8px">Odeslat teď</button></div>

<section id="home">
  <div id="list"></div>
  <p class="note" id="homenote"></p>
  <button class="sec" id="reload" type="button">Obnovit seznam</button>
</section>

<section id="detail" class="hide">
  <div class="card">
    <strong id="dname"></strong>
    <div class="note" id="dlast"></div>
    <img class="shot hide" id="dimg" alt="Fotka měřidla" style="margin-top:10px">
    <div id="dstatus" class="note" style="margin-top:8px"></div>
    <label for="dval">Stav měřidla</label>
    <input id="dval" class="num" type="text" inputmode="decimal" autocomplete="off" placeholder="např. 12345,6">
    <label for="dnote">Poznámka (nepovinná)</label>
    <input id="dnote" type="text" autocomplete="off">
    <div class="row"><button class="sec" id="dretake" type="button">Vyfotit znovu</button><button id="dsend" type="button">Odeslat</button></div>
    <div class="row"><button class="sec" id="dback" type="button">Zpět na seznam</button></div>
  </div>
</section>
</main>

<div id="vf" class="hide">
  <video id="video" playsinline muted></video>
  <div id="frame"></div>
  <div id="hint"></div>
  <div id="bar"><button class="sec" id="vfclose" type="button">Zpět</button><button class="sec hide" id="torch" type="button">💡</button><button id="shot" type="button">Vyfotit</button></div>
</div>
<div id="toast" class="hide"></div>
<div id="yay" class="hide"><div class="tick">✓</div><b id="yaytext">Odesláno</b><span id="yaysub"></span></div>

<script>
// ================= nastavení =================
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyx3UjK_0rqmvNLEMBZPWUpW4dcsu8N3Ovxy3eNb5d4YVUj1zM64mrr8xvn3_uQigSI/exec';
const VERSION = '1.2.0';
const $ = id => document.getElementById(id);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

// tajný kód přijde v odkazu za # (neodesílá se na server hostingu) a uloží se do telefonu
(function () {
  const m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (m) { lsSet('meridla.token', m[1]); history.replaceState(null, '', location.pathname + location.search); }
})();
const token = () => lsGet('meridla.token') || '';

const fmtDate = s => { const d = new Date(s); return d.getDate() + '. ' + (d.getMonth() + 1) + '.'; };
const fmtNum = n => String(n).replace('.', ',');
const parseNum = s => Number(String(s).trim().replace(/\s/g, '').replace(',', '.'));
function toast(t, ms) { const e = $('toast'); e.textContent = t; e.classList.remove('hide'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hide'), ms || 3500); }

// ================= komunikace s Google =================
async function api(path) { const r = await fetch(ENDPOINT + path, { redirect: 'follow' }); return r.json(); }
async function post(obj) {
  const r = await fetch(ENDPOINT, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(obj) });
  const t = await r.text();
  try { return JSON.parse(t); } catch (e) { throw new Error('server: ' + t.replace(/<[^>]+>/g, ' ').replace(/s+/g, ' ').trim().slice(0, 140)); }
}

// ================= fronta odeslání (IndexedDB) =================
const idb = () => new Promise((res, rej) => { const q = indexedDB.open('meridla', 1); q.onupgradeneeded = () => q.result.createObjectStore('q', { autoIncrement: true }); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const idbAll = async () => { const db = await idb(); return new Promise((res, rej) => { const out = [], c = db.transaction('q').objectStore('q').openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out.push({ key: cur.key, val: cur.value }); cur.continue(); } else res(out); }; c.onerror = () => rej(c.error); }); };
const idbAdd = async v => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('q', 'readwrite'); t.objectStore('q').add(v); t.oncomplete = res; t.onerror = () => rej(t.error); }); };
const idbDel = async k => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('q', 'readwrite'); t.objectStore('q').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); };

async function showQueue() {
  let n = 0; try { n = (await idbAll()).length; } catch (e) {}
  $('queue').classList.toggle('hide', !n);
  $('qtext').textContent = n ? 'Čeká na odeslání: ' + n + ' (není signál).' : '';
}
async function flushQueue() {
  let items = []; try { items = await idbAll(); } catch (e) { return; }
  let sent = 0;
  for (const it of items) {
    try { const r = await post(it.val); if (r.ok) { await idbDel(it.key); sent++; } else if (r.error === 'token' || r.error === 'data') { await idbDel(it.key); } else break; }
    catch (e) { break; }
  }
  await showQueue();
  if (sent) { toast('Odesláno čekajících záznamů: ' + sent); loadList(); }
}
$('qgo').onclick = flushQueue;
window.addEventListener('online', flushQueue);

// ================= seznam měřidel =================
let meters = [], current = null;
const iconFor = m => { const n = (m.name + ' ' + (m.unit || '')).toLowerCase(); return /elektr|kwh/.test(n) ? '⚡' : /vod|m³/.test(n) && !/plyn/.test(n) ? '💧' : /plyn/.test(n) ? '🔥' : /tepl|kalor|gj|mwh/.test(n) ? '🌡️' : '📟'; };
function renderProgress() {
  const total = meters.length, done = meters.filter(m => m.doneThisWeek).length;
  $('progress').textContent = !total ? 'Zatím žádná měřidla' : done === total ? 'Tento týden máte hotovo 🎉' : 'Hotovo ' + done + ' z ' + total + ' měřidel';
  $('barfill').style.width = total ? Math.round(done / total * 100) + '%' : '0%';
}
async function loadList() {
  if (!token()) { $('list').innerHTML = ''; $('homenote').innerHTML = '<span class="warn">Chybí tajný kód. Otevři appku přes odkaz, který ti poslali.</span>'; return; }
  $('homenote').textContent = 'Načítám…';
  try {
    const r = await api('?token=' + encodeURIComponent(token()));
    if (!r.ok) { $('homenote').innerHTML = '<span class="warn">Odkaz není platný. Požádej o nový.</span>'; return; }
    meters = r.meters; lsSet('meridla.meters', JSON.stringify(meters)); lsSet('meridla.who', r.who || ''); showWho(); $('homenote').textContent = '';
  } catch (e) {
    try { meters = JSON.parse(lsGet('meridla.meters') || '[]'); } catch (e2) { meters = []; }
    $('homenote').textContent = meters.length ? 'Bez připojení: zobrazen poslední známý seznam.' : 'Nelze načíst seznam, zkontroluj připojení.';
  }
  renderProgress();
  $('list').innerHTML = meters.map((m, i) => `<button class="meter${m.doneThisWeek ? ' done' : ''}" data-id="${m.id}" style="animation-delay:${i * 70}ms">
    <span class="ico">${iconFor(m)}</span><span class="t"><b>${m.name.replace(/</g, '&lt;')}</b><span class="s">${m.last ? 'minule ' + fmtNum(m.last.value) + ' ' + (m.unit || '') + ' (' + fmtDate(m.last.time) + ')' : 'zatím bez odečtu'}</span></span>
    <span class="chip ${m.doneThisWeek ? 'ok' : 'todo'}">${m.doneThisWeek ? '✓ hotovo' : 'chybí'}</span></button>`).join('');
}
$('reload').onclick = loadList;
$('list').addEventListener('click', e => {
  const b = e.target.closest('.meter'); if (!b) return;
  current = meters.find(m => m.id === b.dataset.id); if (current) openCamera();
});

// ================= foťák =================
let stream = null, photoB64 = '';
function closeVf() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $('vf').classList.add('hide'); }
async function openCamera() {
  $('hint').textContent = 'Fotíš: ' + current.name + (current.last ? ' · minule ' + fmtNum(current.last.value) : '');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    $('video').srcObject = stream; await $('video').play(); $('vf').classList.remove('hide');
    const caps = (stream.getVideoTracks()[0].getCapabilities && stream.getVideoTracks()[0].getCapabilities()) || {};
    $('torch').classList.toggle('hide', !caps.torch); $('torch').dataset.on = '';
  } catch (e) { closeVf(); toast('Foťák se nepodařilo spustit. Povol ho v prohlížeči.'); }
}
$('vfclose').onclick = closeVf;
$('torch').onclick = async () => { const on = $('torch').dataset.on !== '1'; try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: on }] }); $('torch').dataset.on = on ? '1' : ''; } catch (e) {} };
$('shot').onclick = () => {
  const v = $('video'), vw = v.videoWidth, vh = v.videoHeight, c = v.getBoundingClientRect(), f = $('frame').getBoundingClientRect();
  const k = Math.max(c.width / vw, c.height / vh), ox = (vw * k - c.width) / 2, oy = (vh * k - c.height) / 2;
  const sx = (f.left - c.left + ox) / k, sy = (f.top - c.top + oy) / k, sw = f.width / k, sh = f.height / k;
  const out = Math.min(1280, Math.round(sw)), cv = document.createElement('canvas');
  cv.width = out; cv.height = Math.round(out * sh / sw);
  cv.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  closeVf(); afterShot(cv);
};

// ================= po vyfocení: AI přečte stav =================
async function afterShot(cv) {
  photoB64 = cv.toDataURL('image/jpeg', 0.8).split(',')[1];
  $('home').classList.add('hide'); $('detail').classList.remove('hide');
  $('dname').textContent = current.name;
  $('dlast').textContent = current.last ? 'Minule: ' + fmtNum(current.last.value) + ' ' + (current.unit || '') + ' (' + fmtDate(current.last.time) + ')' : 'Zatím bez předchozího odečtu';
  $('dimg').src = 'data:image/jpeg;base64,' + photoB64; $('dimg').classList.remove('hide');
  $('dval').value = ''; $('dnote').value = ''; source = 'ručně';
  $('dstatus').textContent = 'Čtu stav z fotky…';
  try {
    const r = await post({ token: token(), action: 'read', id: current.id, photo: photoB64 });
    if (r.ok) { $('dval').value = fmtNum(r.value); source = 'AI'; $('dstatus').textContent = 'Přečteno z fotky. Zkontroluj číslo podle fotky.'; }
    else $('dstatus').textContent = 'Stav se nepodařilo přečíst (' + (r.error || '?') + (r.detail ? ': ' + r.detail : '') + '). Opiš ho prosím ručně.';
  } catch (e) { $('dstatus').textContent = e instanceof TypeError ? 'Bez připojení. Opiš stav ručně, odešle se, až bude signál.' : 'Chyba serveru, opiš stav ručně. (' + e.message + ')'; }
}
let source = 'ručně';
$('dretake').onclick = () => openCamera();
function backHome() { $('detail').classList.add('hide'); $('home').classList.remove('hide'); loadList(); }
$('dback').onclick = backHome;

$('dsend').onclick = async () => {
  const value = parseNum($('dval').value);
  if (!isFinite(value) || $('dval').value.trim() === '') return toast('Zadej stav měřidla.');
  if (current.last && value < current.last.value && !confirm('Zadaný stav (' + fmtNum(value) + ') je nižší než minule (' + fmtNum(current.last.value) + '). Opravdu odeslat?')) return;
  const body = { token: token(), id: current.id, value, note: $('dnote').value.trim(), source, photo: photoB64 };
  $('dsend').disabled = true;
  try {
    const r = await post(body);
    if (!r.ok) throw new Error(r.error || 'chyba');
    if (r.warn) toast('Odesláno, ale hodnota je nižší než minule.', 5000); else yay();
    backHome();
  } catch (e) {
    if (String(e.message) === 'token' || String(e.message) === 'data') toast('Odeslání se nepovedlo: odkaz není platný.');
    else if (!(e instanceof TypeError)) toast('Chyba serveru: ' + String(e.message).slice(0, 120), 7000);
    else { try { await idbAdd(body); await showQueue(); toast('Bez signálu. Uloženo, odešle se samo.'); backHome(); } catch (e2) { toast('Nepodařilo se odeslat ani uložit.'); } }
  } finally { $('dsend').disabled = false; }
};

function yay() {
  const who = (lsGet('meridla.who') || '').split(' ')[0];
  $('yaytext').textContent = who ? 'Díky, ' + who + '!' : 'Odesláno, díky!';
  $('yaysub').textContent = 'Stav je zapsaný a fotka uložená.';
  $('yay').classList.remove('hide');
  try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
  setTimeout(() => $('yay').classList.add('hide'), 1500);
}
$('yay').onclick = () => $('yay').classList.add('hide');

// ================= verze a aktualizace =================
$('ver').textContent = 'verze ' + VERSION;
function showWho() { const w = lsGet('meridla.who'); $('who').textContent = w ? 'Ahoj, ' + w + ' 👋' : 'Ahoj 👋'; }
showWho();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => { $('upd').classList.remove('hide'); $('updgo').onclick = () => w.postMessage('skip'); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { reg.update().catch(() => {}); flushQueue(); loadList(); } });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
}
loadList(); showQueue(); flushQueue();
</script>
</body>
</html>
