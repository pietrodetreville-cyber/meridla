:root{color-scheme:light dark}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
body{background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
 background-image:radial-gradient(900px 520px at 92% -5%,var(--glow1),transparent 62%),radial-gradient(760px 520px at -10% 48%,var(--glow2),transparent 60%),var(--art),linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px),linear-gradient(var(--gl2) 1px,transparent 1px),linear-gradient(90deg,var(--gl2) 1px,transparent 1px);
 background-size:auto,auto,cover,24px 24px,24px 24px,120px 120px,120px 120px;
 background-position:0 0,0 0,center,-1px -1px,-1px -1px,-1px -1px,-1px -1px;
 background-repeat:no-repeat,no-repeat,no-repeat,repeat,repeat,repeat,repeat}
body::after{content:"";position:fixed;z-index:-1;pointer-events:none;right:-25vmax;top:-25vmax;width:75vmax;height:75vmax;border-radius:50%;background:radial-gradient(circle,var(--glow1),transparent 65%);opacity:.7;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-14vmax,18vmax) scale(1.25)}}
.card,.meter,.bchip{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
h1{font-size:1.3rem;margin:18px 0 12px}
#ver{display:block;font-weight:400;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:var(--acc-fg);font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.big{width:100%;padding:16px;font-size:1.1rem}
.meter{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);padding:14px;margin-bottom:10px;border-radius:14px}
.meter .t{flex:1}.meter b{display:block;font-size:1.05rem}
.meter .s{display:block;font-size:.85rem;color:var(--mut)}
.chip{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok);color:var(--acc-fg)}
.chip.todo{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.note{color:var(--mut);font-size:.85rem}
.warn{color:var(--warn)}
label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 3px}
input{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input.num{font-size:1.8rem;font-weight:700;text-align:center}
img.shot{width:100%;border-radius:10px;display:block}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
.hide{display:none}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.mhead strong{font-size:1.15rem}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;padding:9px 4px;background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600}
.seg button.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tiles div{background:#66728218;border-radius:12px;padding:9px 6px;text-align:center}
.tiles b{display:block;font-size:1.05rem}
.tiles span{font-size:.72rem;color:var(--mut)}
#hbody svg{width:100%;height:auto;display:block}
#hbody svg text{fill:var(--mut);font-size:9px}
.hrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.hrow b{white-space:nowrap}
.hrow .inc{color:var(--mut);font-size:.8rem}
.hrow.neg .inc{color:var(--warn)}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(700px 480px at 50% 35%,var(--glow1),transparent 65%),var(--bg);transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
html:has(#splash:not(.out)){overflow:hidden}
#splash img{width:min(54vw,250px);aspect-ratio:1;border-radius:22%;box-shadow:0 18px 50px #0a2a6045;animation:zoomin .9s cubic-bezier(.2,.9,.2,1) both,breath 2.8s ease-in-out .9s infinite}
#splash .sname{font-weight:800;font-size:1.25rem;text-align:center;margin-top:6px}
#splash .ssub{color:var(--mut);font-size:.9rem;min-height:1.3em}
.sbar{width:min(54vw,250px);height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.sbar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--acc);animation:slide 1.2s ease-in-out infinite}
@keyframes zoomin{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.sfind{position:sticky;top:0;z-index:6;padding:4px 0 8px;margin:0 0 4px}
.sfield{display:flex;align-items:center;gap:6px;background:var(--pop);border:1px solid var(--line);border-radius:14px;padding:4px 6px 4px 12px;box-shadow:0 2px 8px #0a2a4010}
.sfield:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px #2563eb33}
.sfield input{flex:1;min-width:0;border:0;background:transparent;padding:9px 2px;font-size:16px;color:var(--fg);outline:none;width:auto}
.sfield button{background:transparent;color:var(--mut);padding:6px 10px;font-size:1rem;border-radius:10px}
.bpill.hide{display:none}
.sfield input::-webkit-search-cancel-button{display:none}
.bpill{display:inline-flex;align-items:center;gap:4px;background:var(--acc);color:var(--acc-fg);font-weight:800;font-size:.85rem;padding:5px 10px;border-radius:999px;white-space:nowrap;cursor:pointer}
.sugg{position:absolute;left:0;right:0;top:calc(100% - 2px);max-height:62vh;overflow:auto;background:var(--pop);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px #0a2a4040;padding:6px;z-index:7}
.sugg h4{margin:8px 8px 4px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--fg);padding:9px 8px;border-radius:10px;font-weight:600}
.sugg button:active,.sugg button:hover{background:#2563eb14}
.sugg .si{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#66728220;font-size:1.1rem}
.sugg .st{flex:1;min-width:0}.sugg .st b{display:block;font-size:.95rem}.sugg .st span{display:block;font-size:.78rem;color:var(--mut);font-weight:500}
.noanim .meter{animation:none}
.sugg .none{padding:12px 10px;color:var(--mut);font-size:.9rem}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:1px 7px;margin-right:6px;border-radius:6px;background:#66728230;color:var(--fg);vertical-align:1px}
.chip.late{background:var(--warn);color:#fff}
.hero{position:relative;border-radius:14px;padding:10px 14px 11px;margin:6px 0 12px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero .hi{font-size:.8rem;font-weight:600;color:var(--mut)}
.hero .big{font-size:1.02rem;font-weight:800;margin:1px 0 7px}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.brand{display:flex;align-items:center;gap:10px;margin:16px 0 12px}
.brand img{width:44px;height:44px;border-radius:12px;box-shadow:0 3px 10px #0002}
.brand h1{margin:0;font-size:1.2rem;line-height:1.15;flex:1}
.themebtn{flex:none;width:42px;height:42px;padding:0;border-radius:50%;background:var(--pop);color:var(--fg);border:1px solid var(--line);font-size:1.2rem;display:grid;place-items:center;box-shadow:0 2px 8px #0a2a4015}
.meter{transition:transform .12s,box-shadow .2s;box-shadow:0 2px 8px #0a2a4010;animation:rise .45s both}
.meter:active{transform:scale(.97)}
.meter.done{background:linear-gradient(90deg,#2563eb18,transparent 60%),var(--card);border-color:#2563eb66}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:#66728220}
.meter.done .ico{background:#2563eb26}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
#yay{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#0e1b27d9;color:#fff;text-align:center;animation:fade .25s both}
#yay.hide{display:none}
#yay .tick{width:110px;height:110px;border-radius:50%;background:var(--acc);color:var(--acc-fg);display:grid;place-items:center;font-size:3.4rem;font-weight:800;animation:pop .5s both}
#yay b{font-size:1.5rem}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#vf{position:fixed;inset:0;background:#000;z-index:10}
#vf.hide{display:none}
#vf video{width:100%;height:100%;object-fit:cover}
#frame{position:absolute;left:50%;top:42%;width:92vw;height:56vw;max-height:60vh;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
#hint{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 14px);text-align:center;color:#fff;font-weight:600;line-height:1.35;text-shadow:0 1px 6px #000a}
#hint small{display:block;font-weight:400;font-size:.9rem;opacity:.95}
#bar{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;gap:12px}
#bar button{flex:1}#bar .sec{color:#fff;border-color:#fff8}
#toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:30;text-align:center}
#toast.hide{display:none}
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt=""><div class="sname">Fotoapp SVJ Od Vysoké</div><div class="sbar"><i></i></div><div class="ssub" id="ssub">Načítám měřidla…</div></div>
<main>
<div class="brand"><img src="icon-192.png" alt=""><h1>Fotoapp SVJ Od Vysoké <span class="note" id="ver"></span></h1><button class="themebtn" id="theme" type="button" aria-label="Režim zobrazení"></button></div>
<div class="hero" id="hero"><div class="hi" id="who"></div><div class="big" id="progress">…</div><div class="bar"><i id="barfill"></i></div></div>
<div class="sfind" id="sbar">
  <div class="sfield"><span aria-hidden="true">🔍</span><span class="bpill hide" id="bpill"></span><input id="q" type="search" placeholder="Hledat: budova, měřidlo, umístění…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><button class="hide" id="qclear" type="button" aria-label="Smazat hledání">✕</button></div>
  <div class="sugg hide" id="sugg"></div>
</div>
<div id="upd" class="card hide" style="border-color:var(--acc)"><strong>Je k dispozici nová verze.</strong><div class="row"><button id="updgo" type="button">Aktualizovat</button></div></div>
<div id="queue" class="card hide"><span id="qtext"></span> <button class="sec" id="qgo" type="button" style="margin-top:8px">Odeslat teď</button></div>

<section id="home">
  <div id="list"></div>
  <p class="note" id="homenote"></p>
  <button class="sec" id="reload" type="button">Obnovit seznam</button>
</section>

<section id="meter" class="hide">
  <div class="card">
    <div class="mhead"><span class="ico" id="micon"></span><div><strong id="mname"></strong><div class="note" id="msub"></div></div></div>
    <div class="note" id="mlast" style="margin:10px 0"></div>
    <div class="row"><button id="mshot" type="button">📷 Vyfotit měřidlo</button></div>
    <div class="row"><button class="sec" id="mhist" type="button">📊 Detail měření</button></div>
    <div class="row"><button class="sec" id="mback" type="button">Zpět na seznam</button></div>
  </div>
</section>

<section id="hist" class="hide">
  <div class="card">
    <strong id="hname"></strong>
    <div class="seg" id="hrange"><button data-r="week" class="on" type="button">Týden</button><button data-r="month" type="button">Měsíc</button><button data-r="year" type="button">Rok</button></div>
    <div id="hbody"></div>
  </div>
  <button class="sec" id="hback" type="button" style="width:100%">Zpět na měřidlo</button>
</section>

<section id="detail" class="hide">
  <div class="card">
    <strong id="dname"></strong>
    <div class="note" id="dlast"></div>
    <img class="shot hide" id="dimg" alt="Fotka měřidla" style="margin-top:10px">
    <div id="dstatus" class="note" style="margin-top:8px"></div>
    <label for="dval">Stav měřidla</label>
    <input id="dval" class="num" type="text" inputmode="decimal" autocomplete="off" placeholder="např. 12345,6">
    <label for="dnote">Poznámka (nepovinná)</label>
    <input id="dnote" type="text" autocomplete="off">
    <div class="row"><button class="sec" id="dretake" type="button">Vyfotit znovu</button><button id="dsend" type="button">Odeslat</button></div>
    <div class="row"><button class="sec" id="dback" type="button">Zpět na seznam</button></div>
  </div>
</section>
</main>

<div id="vf" class="hide">
  <video id="video" playsinline muted></video>
  <div id="frame"></div>
  <div id="hint"></div>
  <div id="bar"><button class="sec" id="vfclose" type="button">Zpět</button><button class="sec hide" id="torch" type="button">💡</button><button id="shot" type="button">Vyfotit</button></div>
</div>
<div id="toast" class="hide"></div>
<div id="yay" class="hide"><div class="tick">✓</div><b id="yaytext">Odesláno</b><span id="yaysub"></span></div>

<script>
// ================= nastavení =================
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyx3UjK_0rqmvNLEMBZPWUpW4dcsu8N3Ovxy3eNb5d4YVUj1zM64mrr8xvn3_uQigSI/exec';
const VERSION = '1.11.1';
const $ = id => document.getElementById(id);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

// tajný kód přijde v odkazu za # (neodesílá se na server hostingu) a uloží se do telefonu
(function () {
  const m = location.hash.match(/k=([A-Za-z0-9]+)/);
  if (m) { lsSet('meridla.token', m[1]); history.replaceState(null, '', location.pathname + location.search); }
})();
const token = () => lsGet('meridla.token') || '';

const fmtDate = s => { const d = new Date(s); return d.getDate() + '. ' + (d.getMonth() + 1) + '.'; };
const fmtDT = s => { const d = new Date(s); return d.getDate() + '. ' + (d.getMonth() + 1) + '. v ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
const lastInfo = m => m.last ? 'Naposledy: ' + fmtDT(m.last.time) + (m.last.who ? ', ' + m.last.who : '') : 'Zatím nikdo nefotil';
const fmtNum = n => String(n).replace('.', ',');
const parseNum = s => Number(String(s).trim().replace(/\s/g, '').replace(',', '.'));
function toast(t, ms) { const e = $('toast'); e.textContent = t; e.classList.remove('hide'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hide'), ms || 3500); }

// ================= komunikace s Google =================
async function api(path) { const r = await fetch(ENDPOINT + path, { redirect: 'follow' }); return r.json(); }
async function post(obj) {
  const r = await fetch(ENDPOINT, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(obj) });
  const t = await r.text();
  try { return JSON.parse(t); } catch (e) { throw new Error('server: ' + t.replace(/<[^>]+>/g, ' ').replace(/s+/g, ' ').trim().slice(0, 140)); }
}

// ================= fronta odeslání (IndexedDB) =================
const idb = () => new Promise((res, rej) => { const q = indexedDB.open('meridla', 1); q.onupgradeneeded = () => q.result.createObjectStore('q', { autoIncrement: true }); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const idbAll = async () => { const db = await idb(); return new Promise((res, rej) => { const out = [], c = db.transaction('q').objectStore('q').openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out.push({ key: cur.key, val: cur.value }); cur.continue(); } else res(out); }; c.onerror = () => rej(c.error); }); };
const idbAdd = async v => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('q', 'readwrite'); t.objectStore('q').add(v); t.oncomplete = res; t.onerror = () => rej(t.error); }); };
const idbDel = async k => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('q', 'readwrite'); t.objectStore('q').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); };

async function showQueue() {
  let n = 0; try { n = (await idbAll()).length; } catch (e) {}
  $('queue').classList.toggle('hide', !n);
  $('qtext').textContent = n ? 'Čeká na odeslání: ' + n + ' (není signál).' : '';
}
async function flushQueue() {
  let items = []; try { items = await idbAll(); } catch (e) { return; }
  let sent = 0;
  for (const it of items) {
    try { const r = await post(it.val); if (r.ok) { await idbDel(it.key); sent++; } else if (r.error === 'token' || r.error === 'data') { await idbDel(it.key); } else break; }
    catch (e) { break; }
  }
  await showQueue();
  if (sent) { toast('Odesláno čekajících záznamů: ' + sent); loadList(); }
}
$('qgo').onclick = flushQueue;
window.addEventListener('online', flushQueue);

// ================= seznam měřidel =================
let meters = [], current = null;
const iconFor = m => { if (m.icon) return m.icon; const n = ((m.typeName || '') + ' ' + m.name + ' ' + (m.unit || '')).toLowerCase(); return /elektr|kwh/.test(n) ? '⚡' : /vod|m³/.test(n) && !/plyn/.test(n) ? '💧' : /plyn/.test(n) ? '🔥' : /tepl|kalor|gj|mwh/.test(n) ? '🌡️' : '📟'; };
const isDue = m => m.due !== undefined ? m.due : !m.doneThisWeek;
const plural = (n, a, b, c) => n === 1 ? a : n >= 2 && n <= 4 ? b : c;
const days = n => n + ' ' + plural(n, 'den', 'dny', 'dní');
const bOf = m => m.building || 'Ostatní';
let building = lsGet('meridla.building') || '';
function buildingList() {
  const set = []; meters.forEach(m => { const b = bOf(m); if (!set.includes(b)) set.push(b); });
  const num = b => /^\d+$/.test(b);
  return set.sort((a, b) => num(a) && num(b) ? a - b : num(a) ? -1 : num(b) ? 1 : a.localeCompare(b, 'cs'));
}
// ---- hledání s našeptávačem ----
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
let query = '';
const hay = m => norm([m.name, m.typeName, m.building ? 'budova ' + m.building : '', m.place, m.unit, m.last && m.last.who].filter(Boolean).join(' '));
const textMatch = m => { const t = norm(query).split(/\s+/).filter(Boolean); if (!t.length) return true; const x = hay(m); return t.every(w => x.includes(w)); };
const inBuilding = () => building ? meters.filter(m => bOf(m) === building) : meters;
const visible = () => inBuilding().filter(textMatch);
const badgeN = list => list.filter(isDue).length;
function setBuilding(b) { building = b || ''; lsSet('meridla.building', building); query = ''; $('q').value = ''; hideSugg(); renderAll(); }
function renderSearchBar() {
  const bs = buildingList();
  if (building && !bs.includes(building)) building = '';
  $('sbar').classList.toggle('hide', !meters.length);
  const pill = $('bpill');
  pill.classList.toggle('hide', !building); pill.textContent = building ? 'Budova ' + building + ' ✕' : '';
  $('qclear').classList.toggle('hide', !query);
}
function hideSugg() { $('sugg').classList.add('hide'); }
function statusLine(m) { return isDue(m) ? (!m.last ? 'chybí odečet' : m.overdueDays ? 'po termínu ' + days(m.overdueDays) : 'je čas na odečet') : '✓ hotovo'; }
function renderSugg() {
  const box = $('sugg'), qn = norm(query).trim(), esc = s => String(s).replace(/</g, '&lt;');
  const bs = buildingList().filter(x => !qn || qn.split(/\s+/).every(w => norm('budova ' + x).includes(w)));
  let ms = inBuilding().filter(textMatch).sort((x, y) => (isDue(y) - isDue(x)) || ((y.overdueDays || 0) - (x.overdueDays || 0)));
  let html = '';
  if (!building && bs.length > 1 || (!building && bs.length === 1 && qn)) html += '<h4>Budovy</h4>' + bs.map(x => { const l = meters.filter(m => bOf(m) === x), n = badgeN(l); return '<button data-b="' + esc(x).replace(/"/g, '') + '"><span class="si">🏢</span><span class="st"><b>Budova ' + esc(x) + '</b><span>' + l.length + ' ' + plural(l.length, 'měřidlo', 'měřidla', 'měřidel') + (n ? ' · k odečtu: ' + n : ' · vše hotovo') + '</span></span></button>'; }).join('');
  if (!qn) ms = ms.filter(isDue);
  if (ms.length) html += '<h4>' + (qn ? 'Měřidla' : 'K odečtu') + '</h4>' + ms.slice(0, 8).map(m => '<button data-m="' + esc(m.id) + '"><span class="si">' + iconFor(m) + '</span><span class="st"><b>' + (m.building ? esc(m.building) + ' · ' : '') + esc(m.name) + '</b><span>' + [m.place, statusLine(m)].filter(Boolean).map(esc).join(' · ') + '</span></span></button>').join('');
  else if (qn) html += '<div class="none">Nic nenalezeno.</div>';
  else if (!html) html += '<div class="none">Vše je hotovo 🎉</div>';
  box.innerHTML = html; box.classList.toggle('hide', !html);
}
$('q').addEventListener('focus', () => { renderSugg(); });
$('q').addEventListener('input', e => { query = e.target.value; renderSearchBar(); renderSugg(); renderAll(true); });
$('qclear').onclick = () => { query = ''; $('q').value = ''; renderSearchBar(); renderSugg(); renderAll(true); $('q').focus(); };
$('bpill').onclick = () => setBuilding('');
$('sugg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.m !== undefined) { current = meters.find(m => m.id === b.dataset.m); hideSugg(); $('q').blur(); if (current) openMeter(current); }
  else if (b.dataset.b !== undefined) { setBuilding(b.dataset.b); }
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('#sbar')) hideSugg(); });
$('q').addEventListener('keydown', e => { if (e.key === 'Escape') { hideSugg(); $('q').blur(); } });
function renderProgress() {
  const list = inBuilding(), total = list.length, due = list.filter(isDue).length, done = total - due;
  $('progress').textContent = !total ? 'Zatím žádná měřidla' : !due ? (building ? 'Budova ' + building + ': vše hotovo 🎉' : 'Vše je hotovo 🎉') : 'K odečtu: ' + due + ' z ' + total;
  $('barfill').style.width = total ? Math.round(done / total * 100) + '%' : '0%';
}
function chipFor(m) {
  if (!isDue(m)) return '<span class="chip ok">✓ hotovo</span>';
  if (!m.last) return '<span class="chip todo">chybí</span>';
  return m.overdueDays ? '<span class="chip late">po termínu ' + days(m.overdueDays) + '</span>' : '<span class="chip todo">je čas</span>';
}
function renderAll(noAnim) {
  $('list').classList.toggle('noanim', !!noAnim);
  renderSearchBar(); renderProgress();
  const list = visible().slice().sort((a, b) => (isDue(b) - isDue(a)) || ((b.overdueDays || 0) - (a.overdueDays || 0)));
  if (!list.length && meters.length) { $('list').innerHTML = '<p class="note" style="text-align:center;padding:18px 0">Žádné měřidlo neodpovídá hledání.</p>'; return; }
  $('list').innerHTML = list.map((m, i) => '<button class="meter' + (isDue(m) ? '' : ' done') + '" data-id="' + m.id + '" style="animation-delay:' + i * 60 + 'ms">' +
    '<span class="ico">' + iconFor(m) + '</span><span class="t"><b>' + (!building && m.building ? '<span class="tag">' + m.building.replace(/</g, '&lt;') + '</span>' : '') + m.name.replace(/</g, '&lt;') + '</b>' +
    '<span class="s">' + (m.place ? m.place + ' · ' : '') + (m.last ? 'minule ' + fmtNum(m.last.value) + ' ' + (m.unit || '') + ' · ' + fmtDate(m.last.time) + (m.last.who ? ', ' + m.last.who : '') : 'zatím bez odečtu') + '</span>' +
    '<span class="s">' + (isDue(m) ? '' : 'další odečet za ' + days(m.remainingDays || 0) + ' · ') + 'interval ' + days(m.interval || 7) + '</span></span>' +
    chipFor(m) + '</button>').join('');
}
async function loadList() {
  if (!token()) { $('list').innerHTML = ''; $('homenote').innerHTML = '<span class="warn">Chybí tajný kód. Otevři appku přes odkaz, který ti poslali.</span>'; return; }
  $('homenote').textContent = 'Načítám…';
  try {
    const r = await api('?token=' + encodeURIComponent(token()));
    if (!r.ok) { $('homenote').innerHTML = '<span class="warn">Odkaz není platný. Požádej o nový.</span>'; return; }
    meters = r.meters; lsSet('meridla.meters', JSON.stringify(meters)); lsSet('meridla.who', r.who || ''); showWho(); $('homenote').textContent = '';
  } catch (e) {
    try { meters = JSON.parse(lsGet('meridla.meters') || '[]'); } catch (e2) { meters = []; }
    $('homenote').textContent = meters.length ? 'Bez připojení: zobrazen poslední známý seznam.' : 'Nelze načíst seznam, zkontroluj připojení.';
  }
  renderAll();
}
$('reload').onclick = loadList;
$('list').addEventListener('click', e => {
  const b = e.target.closest('.meter'); if (!b) return;
  current = meters.find(m => m.id === b.dataset.id); if (current) openMeter(current);
});

// ================= obrazovky =================
function show(name) {
  ['home', 'meter', 'hist', 'detail'].forEach(n => $(n).classList.toggle('hide', n !== name));
  $('hero').style.display = name === 'home' ? '' : 'none'; $('sbar').style.display = name === 'home' ? '' : 'none'; hideSugg();
  window.scrollTo(0, 0);
}
function openMeter(m) {
  current = m;
  $('micon').textContent = iconFor(m); $('mname').textContent = m.name;
  $('msub').textContent = [m.building ? 'Budova ' + m.building : '', m.place, m.typeName].filter(Boolean).join(' · ');
  $('mlast').textContent = lastInfo(m) + (m.last ? ' (stav ' + fmtNum(m.last.value) + ' ' + (m.unit || '') + ')' : '');
  show('meter');
}
$('mshot').onclick = () => openCamera();
$('mback').onclick = () => show('home');
$('hback').onclick = () => show('meter');
$('mhist').onclick = async () => { $('hname').textContent = current.name + (current.building ? ' · ' + current.building : ''); show('hist'); await loadHist(); };

// ================= detail měření: týden / měsíc / rok =================
let hist = { id: null, readings: null, range: 'week' };
$('hrange').addEventListener('click', e => { const r = e.target.dataset.r; if (!r) return; hist.range = r; if (hist.readings) renderHist(); });
async function loadHist() {
  const body = $('hbody');
  if (hist.id !== current.id || !hist.readings) {
    body.innerHTML = '<p class="note">Načítám…</p>';
    try {
      const r = await api('?token=' + encodeURIComponent(token()) + '&action=history&id=' + encodeURIComponent(current.id));
      if (!r.ok) throw new Error(r.error || 'chyba');
      hist = { id: current.id, range: hist.range, readings: r.readings.map(x => ({ t: new Date(x.time), v: Number(x.value), who: x.who })) };
    } catch (e) { body.innerHTML = '<p class="note warn">Detail se nepodařilo načíst' + (e instanceof TypeError ? ' (bez připojení)' : '') + '.</p>'; return; }
  }
  renderHist();
}
const fmtD = x => fmtNum(Math.round(x * 100) / 100);
function renderHist() {
  for (const b of document.querySelectorAll('#hrange button')) b.classList.toggle('on', b.dataset.r === hist.range);
  const rs = hist.readings, unit = current.unit || '', DAY = 864e5, now = new Date();
  const inc = rs.map((x, i) => i ? x.v - rs[i - 1].v : null);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), buckets = [];
  if (hist.range === 'year') {
    for (let k = 11; k >= 0; k--) { const d = new Date(today.getFullYear(), today.getMonth() - k, 1); buckets.push({ start: d, end: new Date(d.getFullYear(), d.getMonth() + 1, 1), label: String(d.getMonth() + 1), sum: 0 }); }
  } else {
    const n = hist.range === 'week' ? 7 : 30, wd = ['ne', 'po', 'út', 'st', 'čt', 'pá', 'so'];
    for (let k = n - 1; k >= 0; k--) { const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - k); buckets.push({ start: d, end: new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1), label: hist.range === 'week' ? wd[d.getDay()] : (k % 5 === 0 || k === n - 1 ? String(d.getDate()) : ''), sum: 0 }); }
  }
  const from = buckets[0].start, to = buckets[buckets.length - 1].end, idx = [];
  let resets = 0;
  rs.forEach((x, i) => {
    if (x.t < from || x.t >= to) return;
    idx.push(i);
    const b = buckets.find(q => x.t >= q.start && x.t < q.end);
    if (inc[i] === null) return;
    if (inc[i] < 0) resets++; else if (b) b.sum += inc[i];
  });
  const total = buckets.reduce((a, b) => a + b.sum, 0), days = Math.max(1, Math.round((to - from) / DAY));
  const W = 340, H = 150, L = 4, T = 16, B = 20, max = Math.max(...buckets.map(b => b.sum), 0.0001), bw = (W - 2 * L) / buckets.length;
  const bars = buckets.map((b, i) => { const bh = b.sum / max * (H - T - B), x = L + i * bw; return '<rect x="' + (x + bw * 0.15).toFixed(1) + '" y="' + (H - B - bh).toFixed(1) + '" width="' + (bw * 0.7).toFixed(1) + '" height="' + Math.max(bh, b.sum > 0 ? 1.5 : 0).toFixed(1) + '" rx="2" fill="var(--acc)"/>' + (buckets.length <= 12 && b.sum > 0 ? '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - B - bh - 3).toFixed(1) + '" text-anchor="middle">' + fmtD(b.sum) + '</text>' : '') + '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + b.label + '</text>'; }).join('');
  const rows = idx.slice().reverse().map(i => { const x = rs[i], neg = inc[i] !== null && inc[i] < 0; return '<div class="hrow' + (neg ? ' neg' : '') + '"><span>' + fmtDT(x.t) + (x.who ? '<br><span class="note">' + x.who.replace(/</g, '&lt;') + '</span>' : '') + '</span><span style="text-align:right"><b>' + fmtNum(x.v) + ' ' + unit + '</b><br><span class="inc">' + (inc[i] === null ? 'první odečet' : neg ? 'nižší než minule' : '+' + fmtD(inc[i])) + '</span></span></div>'; }).join('');
  $('hbody').innerHTML =
    '<div class="tiles"><div><b>' + fmtD(total) + ' ' + unit + '</b><span>spotřeba</span></div><div><b>' + fmtD(total / days) + '</b><span>průměr za den</span></div><div><b>' + idx.length + '</b><span>odečtů</span></div></div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Spotřeba v období">' + bars + '</svg>' +
    (resets ? '<p class="note warn">V období je ' + resets + ' odečet s nižším stavem než předtím. Do spotřeby se nezapočítal.</p>' : '') +
    (idx.length ? '<div style="margin-top:6px">' + rows + '</div>' : '<p class="note">V tomto období není žádný odečet.</p>');
}

// ================= foťák =================
let stream = null, photoB64 = '';
function closeVf() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $('vf').classList.add('hide'); }
async function openCamera() {
  const hint = $('hint'); hint.textContent = 'Fotíš: ' + current.name + (current.place ? ' (' + current.place + ')' : '');
  const sm = document.createElement('small'); sm.textContent = lastInfo(current) + (current.last ? ' (stav ' + fmtNum(current.last.value) + ')' : ''); hint.appendChild(sm);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    $('video').srcObject = stream; await $('video').play(); $('vf').classList.remove('hide');
    const caps = (stream.getVideoTracks()[0].getCapabilities && stream.getVideoTracks()[0].getCapabilities()) || {};
    $('torch').classList.toggle('hide', !caps.torch); $('torch').dataset.on = '';
  } catch (e) { closeVf(); toast('Foťák se nepodařilo spustit. Povol ho v prohlížeči.'); }
}
$('vfclose').onclick = closeVf;
$('torch').onclick = async () => { const on = $('torch').dataset.on !== '1'; try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: on }] }); $('torch').dataset.on = on ? '1' : ''; } catch (e) {} };
$('shot').onclick = () => {
  const v = $('video'), vw = v.videoWidth, vh = v.videoHeight, c = v.getBoundingClientRect(), f = $('frame').getBoundingClientRect();
  const k = Math.max(c.width / vw, c.height / vh), ox = (vw * k - c.width) / 2, oy = (vh * k - c.height) / 2;
  const sx = (f.left - c.left + ox) / k, sy = (f.top - c.top + oy) / k, sw = f.width / k, sh = f.height / k;
  const out = Math.min(1280, Math.round(sw)), cv = document.createElement('canvas');
  cv.width = out; cv.height = Math.round(out * sh / sw);
  cv.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  closeVf(); afterShot(cv);
};

// ================= po vyfocení: AI přečte stav =================
async function afterShot(cv) {
  photoB64 = cv.toDataURL('image/jpeg', 0.8).split(',')[1];
  show('detail');
  $('dname').textContent = current.name;
  $('dlast').textContent = current.last ? lastInfo(current) + ' (stav ' + fmtNum(current.last.value) + ' ' + (current.unit || '') + ')' : 'Zatím bez předchozího odečtu';
  $('dimg').src = 'data:image/jpeg;base64,' + photoB64; $('dimg').classList.remove('hide');
  $('dval').value = ''; $('dnote').value = ''; source = 'ručně';
  $('dstatus').textContent = 'Čtu stav z fotky…';
  try {
    const r = await post({ token: token(), action: 'read', id: current.id, photo: photoB64 });
    if (r.ok) { $('dval').value = fmtNum(r.value); source = 'AI'; $('dstatus').textContent = 'Přečteno z fotky. Zkontroluj číslo podle fotky.'; }
    else $('dstatus').textContent = 'Stav se nepodařilo přečíst (' + (r.error || '?') + (r.detail ? ': ' + r.detail : '') + '). Opiš ho prosím ručně.';
  } catch (e) { $('dstatus').textContent = e instanceof TypeError ? 'Bez připojení. Opiš stav ručně, odešle se, až bude signál.' : 'Chyba serveru, opiš stav ručně. (' + e.message + ')'; }
}
let source = 'ručně';
$('dretake').onclick = () => openCamera();
function backHome() { show('home'); loadList(); }
$('dback').onclick = backHome;

$('dsend').onclick = async () => {
  const value = parseNum($('dval').value);
  if (!isFinite(value) || $('dval').value.trim() === '') return toast('Zadej stav měřidla.');
  if (current.last && value < current.last.value && !confirm('Zadaný stav (' + fmtNum(value) + ') je nižší než minule (' + fmtNum(current.last.value) + '). Opravdu odeslat?')) return;
  const body = { token: token(), id: current.id, value, note: $('dnote').value.trim(), source, photo: photoB64 };
  $('dsend').disabled = true;
  try {
    const r = await post(body);
    if (!r.ok) throw new Error(r.error || 'chyba');
    if (r.warn) toast('Odesláno, ale hodnota je nižší než minule.', 5000); else yay();
    backHome();
  } catch (e) {
    if (String(e.message) === 'token' || String(e.message) === 'data') toast('Odeslání se nepovedlo: odkaz není platný.');
    else if (!(e instanceof TypeError)) toast('Chyba serveru: ' + String(e.message).slice(0, 120), 7000);
    else { try { await idbAdd(body); await showQueue(); toast('Bez signálu. Uloženo, odešle se samo.'); backHome(); } catch (e2) { toast('Nepodařilo se odeslat ani uložit.'); } }
  } finally { $('dsend').disabled = false; }
};

function yay() {
  const who = (lsGet('meridla.who') || '').split(' ')[0];
  $('yaytext').textContent = who ? 'Díky, ' + who + '!' : 'Odesláno, díky!';
  $('yaysub').textContent = 'Stav je zapsaný a fotka uložená.';
  $('yay').classList.remove('hide');
  try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
  setTimeout(() => $('yay').classList.add('hide'), 1500);
}
$('yay').onclick = () => $('yay').classList.add('hide');

// ================= režim zobrazení =================
const THEME_ICON = { auto: '🌓', light: '☀️', dark: '🌙' }, THEME_NAME = { auto: 'automaticky podle telefonu', light: 'světlý', dark: 'tmavý' };
function applyTheme(mode) {
  const root = document.documentElement;
  if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
  // barva horní a spodní lišty telefonu
  document.querySelectorAll('meta[name=theme-color]').forEach((m, i) => {
    if (!m.dataset.media) m.dataset.media = m.getAttribute('media') || '';
    if (mode === 'auto') { m.setAttribute('media', m.dataset.media); m.setAttribute('content', i === 0 ? '#2563eb' : '#11151b'); }
    else { m.removeAttribute('media'); m.setAttribute('content', mode === 'dark' ? '#11151b' : '#2563eb'); }
  });
  const b = $('theme'); b.textContent = THEME_ICON[mode]; b.title = 'Režim: ' + THEME_NAME[mode];
  b.setAttribute('aria-label', 'Režim zobrazení: ' + THEME_NAME[mode]);
}
let themeMode = lsGet('meridla.theme'); if (themeMode !== 'light' && themeMode !== 'dark') themeMode = 'auto';
applyTheme(themeMode);
$('theme').onclick = () => {
  themeMode = themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto';
  lsSet('meridla.theme', themeMode); applyTheme(themeMode);
  toast('Režim: ' + THEME_NAME[themeMode], 1800);
};

// ================= verze a aktualizace =================
$('ver').textContent = 'verze ' + VERSION;
function showWho() { const w = lsGet('meridla.who'); $('who').textContent = w ? 'Ahoj, ' + w + ' 👋' : 'Ahoj 👋'; }
showWho();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => { $('upd').classList.remove('hide'); $('updgo').onclick = () => w.postMessage('skip'); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { reg.update().catch(() => {}); flushQueue(); loadList(); } });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded) return; reloaded = true; location.reload(); });
}
// ================= start: úvodní obrazovka, data se načítají na pozadí =================
const SPLASH_MIN = 2000, splashStart = Date.now();
function hideSplash() { const s = $('splash'); if (!s || s.classList.contains('out')) return; s.classList.add('out'); setTimeout(() => s.remove(), 800); }
// poslední známý seznam se ukáže hned, čerstvý se dotáhne na pozadí
try { const c = JSON.parse(lsGet('meridla.meters') || '[]'); if (c.length) { meters = c; showWho(); renderAll(); $('homenote').textContent = 'Aktualizuji…'; } } catch (e) {}
const loading = loadList().catch(() => {}).then(() => { const t = $('ssub'); if (t) t.textContent = 'Hotovo ✓'; });
showQueue(); flushQueue();
loading.then(() => setTimeout(hideSplash, Math.max(350, SPLASH_MIN - (Date.now() - splashStart))));
setTimeout(hideSplash, 8000);
</script>
